<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>समाधान Setu — Community problem solving</title><meta name="theme-color" content="#087cae"><link rel="icon" type="image/webp" sizes="48x48" href="/assets/favicon.webp?v=4"><link rel="apple-touch-icon" href="/assets/favicon.webp?v=4"><style>
:root{--blue:#087cae;--ink:#18364b;--muted:#5b7183;--line:#dce8f1;--bg:#f5f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}nav,main{max-width:1150px;margin:auto;padding:18px 24px}nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.7px}.logo{background:var(--blue);color:#fff;padding:9px 13px;border-radius:12px}.tiny{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}.tag{display:inline-block;font-size:12px;font-weight:650;background:#e8f5fc;color:#075b88;padding:5px 10px;border-radius:20px;white-space:normal}.tag.high{background:#ffece5;color:#ab421d}button{font:inherit;font-weight:650;background:var(--blue);color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}button:hover{filter:brightness(.93)}button:disabled{opacity:.6;cursor:wait}.secondary{color:var(--blue);background:white;border:1px solid var(--line)}.danger{color:#ad392b;background:#fff0eb}a{color:var(--blue)}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-2px;line-height:1.08;margin:10px 0 16px}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 14px}.muted{color:var(--muted)}.hero{background:#104c73;color:white;border-radius:23px;padding:42px 36px;display:grid;grid-template-columns:1.35fr .65fr;gap:30px;align-items:center}.hero p{color:#e4f3fc;max-width:600px}.hero button{background:#ff8b29;color:#104c73}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-weight:750;font-size:11px;color:#ffbd83}.heroart{border:1px solid #ffffff30;border-radius:15px;padding:20px;background:#ffffff08}.heroart div{padding:10px 0;border-bottom:1px solid #ffffff20}.heroart div:last-child{border:0}.cards,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stats{grid-template-columns:repeat(4,1fr)}.panel,.stat,.issue,.rolecard{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.stat strong{display:block;font-size:30px;letter-spacing:-1px}.rolecard button{width:100%;margin-top:10px}.num{font-size:12px;color:var(--blue);font-weight:750;letter-spacing:1px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.login{max-width:460px;margin:36px auto}.field{display:block;font-size:13px;font-weight:650;margin:12px 0}input,textarea,select{font:inherit;background:white;color:var(--ink);display:block;width:100%;padding:11px;border:1px solid #c9dce9;border-radius:9px;margin-top:6px}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #79c9ef;outline-offset:1px}.notice{background:#e9f6ff;padding:12px;border-radius:9px;color:#135d86;font-size:13px;margin:12px 0}.issues{display:grid;gap:12px}.issue{padding:17px}.issue p{overflow-wrap:anywhere}.issue img,.preview{max-width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin:8px 0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions button{font-size:13px;padding:8px 12px}.meta{font-size:13px;color:var(--muted);margin:8px 0}.steps{display:flex;gap:5px;margin:12px 0}.steps span{flex:1;height:6px;background:#dcebf5;border-radius:6px}.steps .done{background:#0c96d2}.solution{border-left:3px solid #0c96d2;background:#f0f8fd;padding:12px;margin:12px 0;overflow-wrap:anywhere}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.foot{text-align:center;color:var(--muted);font-size:12px;margin:28px 0}.error{color:#ac3127;font-size:13px}.full{width:100%}#toast{position:fixed;bottom:20px;right:20px;background:#104c73;color:white;padding:12px 18px;border-radius:10px;max-width:90%;display:none;z-index:3} @media(max-width:750px){nav,main{padding:14px}.hero{grid-template-columns:1fr;padding:26px 20px}.heroart{display:none}.cards,.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.panel{padding:16px}}

/* Samadhan Setu brand palette — original orange and sky-blue logo */
:root{--orange:#ff7800;--sky:#0aa4df;--blue:#087cae;--navy:#14384f;--pale-blue:#e9f6ff;--pale-orange:#fff3e6}
body{background:linear-gradient(150deg,#fff9f3 0%,#f7fbff 32%,#f1f8fd 100%);min-height:100vh}
header{border-top:4px solid var(--orange);border-bottom:1px solid #dceaf3;box-shadow:0 3px 18px #14384f08}nav{padding-top:8px;padding-bottom:8px}
.brand{gap:15px}.brand-logo{width:112px;height:77px;object-fit:contain;display:block}.brand-caption{font-size:12px;font-weight:600;line-height:1.4;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;letter-spacing:0}
.hero{background:linear-gradient(115deg,#103e64 0%,#086b9c 62%,#087fae 100%);position:relative;overflow:hidden;box-shadow:0 12px 30px #0b659b17}.hero:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--orange) 0%,#ff9d4d 45%,#69d4ff 100%)}.hero button{background:var(--orange);color:#182e40;box-shadow:0 3px 12px #0c37553b}.hero .eyebrow{color:#ffd0a4}
button{background:var(--blue)}button.secondary{background:#fff;color:#08668e;border-color:#c8e1f1}button.danger{background:#fff0eb;color:#a33125}button:focus-visible{outline:3px solid #f9a153;outline-offset:2px}
.rolecard,.panel,.stat{box-shadow:0 4px 14px #163d5806}.rolecard{border-top:3px solid var(--sky)}.rolecard:nth-child(2){border-top-color:var(--orange)}.rolecard .num{color:#b45309}.rolecard button:hover{background:#eaf7ff}
.stat{position:relative;overflow:hidden}.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sky)}.stat:nth-child(2):before,.stat:nth-child(4):before{background:var(--orange)}.stat strong{color:#075d87}.stat:nth-child(2) strong{color:#b45309}
.notice{border:1px solid #d3eaf9}.tag{background:var(--pale-blue);color:#075b88}.tag.high{background:#fff0e2;color:#a64308}.steps .done{background:linear-gradient(90deg,#0b8dc7,#19b5e5)}.steps .done:last-child{background:var(--orange)}
.login{border-top:4px solid var(--orange);box-shadow:0 12px 40px #173d5812}.login-logo{display:block;width:142px;height:auto;margin:0 auto 20px}.login .num{color:#b45309}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px}.footer-logo{width:74px;height:auto;object-fit:contain;background:white;border-radius:6px;padding:3px}.solution{border-left-color:var(--sky)}
@media(max-width:750px){.brand-logo{width:90px;height:62px}.brand-caption{font-size:10px;padding-left:9px}.brand{gap:9px}nav{padding:8px 14px}.hero{border-radius:16px}.rolecard{padding:18px}}
@media(max-width:390px){.brand-caption{display:none}}
.status[data-status="Submitted"],.status[data-status="Solution proposed"]{background:#fff0e2;color:#9a4a0b}.status[data-status="Rejected"]{background:#ffebe6;color:#a33125}.status[data-status="Closed"],.status[data-status="Solution approved"]{background:#e1f4ff;color:#09577d}</style></head><body><header><nav><div class="brand"><img class="brand-logo" src="/assets/logo.webp" width="112" height="77" alt="समाधान Setu"><div class="brand-caption">Community innovation<br>platform</div></div><div id="nav"><span class="tag">Academic demonstration</span></div></nav></header><main id="app"><p>Loading...</p></main><div id="toast" role="status"></div><script>
const training={'Infrastructure':['road pothole damaged bridge street','sadak gaddha road accident','road repair unsafe traffic'],'Water supply':['water dirty drinking pipeline leak','paani pani contaminated tap water','water supply shortage village'],'Electricity':['electricity power outage light wire','bijli transformer electric light','power cut streetlight'],'Sanitation':['garbage waste drainage sewage dirty','kachra nala trash plastic collection','overflow drain sanitation waste'],'Education':['school classroom teacher student','school classroom roof education','library books learning'],'Healthcare':['hospital doctor medicine health clinic','medical patient ambulance healthcare','hospital health center treatment'],'Agriculture':['farmer crop irrigation soil','kisan fasal crop pest farm','farming seed agriculture']};
const routing={'Infrastructure':['Public Works Department','Civil Engineering'],'Water supply':['Water Supply Department','Environmental Engineering'],'Electricity':['Electricity Board','Electrical Engineering'],'Sanitation':['Local Municipal Body','Environmental Engineering'],'Education':['Education Department','Civil Engineering'],'Healthcare':['Health Department','Biomedical Engineering'],'Agriculture':['Agriculture Department','Agricultural Engineering']};
const tokens=s=>s.toLowerCase().match(/[a-z]+/g)||[],models={},vocab=new Set();for(const [cat,docs] of Object.entries(training)){const counts={};let n=0;for(const d of docs)for(const w of tokens(d)){counts[w]=(counts[w]||0)+1;n++;vocab.add(w)}models[cat]={counts,n}}
function analyze(s){const known=tokens(s).filter(w=>vocab.has(w));const rank=Object.entries(models).map(([cat,m])=>[cat,known.reduce((v,w)=>v+Math.log(((m.counts[w]||0)+1)/(m.n+vocab.size)),0)]).sort((a,b)=>b[1]-a[1]);const cat=known.length&&rank[0][1]-rank[1][1]>.1?rank[0][0]:'Other / review';const route=routing[cat]||['Manual review','General expertise'];return{category:cat,department:route[0],expertise:route[1],priority:/\b(accident|emergency|danger|unsafe|severe|injury|contaminated)\b/i.test(s)?'High':'Needs review'}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=['Submitted','Verified','Assigned','Solution proposed','Solution approved','Closed'];
let data=[],role=null,photo='',filter='All',busy=false,editing=null,refreshing=false;
const app=document.querySelector('#app'),nav=document.querySelector('#nav');
const roleNames={citizen:'Citizen',admin:'Government admin',student:'Student team'};
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',4000)}
async function api(body){const res=await fetch('/api/session',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await res.json();if(!res.ok)throw Error(j.error||'Request failed');return j}
async function refresh(force=false){if(!role||busy||refreshing)return;refreshing=true;try{const j=await api({action:'list'});if(JSON.stringify(j.data)!==JSON.stringify(data)){data=j.data;if(force||(!editing&&!app.contains(document.activeElement)&&!document.querySelector('#report input[name=title]')?.value&&!document.querySelector('#report textarea')?.value&&!photo))render();else document.querySelector('#sync')&&(document.querySelector('#sync').textContent='New updates available · Refresh')}else if(force)render();if(force)toast('Reports refreshed')}catch(e){if(force)toast(e.message)}finally{refreshing=false}}
async function load(){const j=await api({action:'list'});data=j.data;render()}
function foot(){return '<div class="foot"><img class="footer-logo" src="/assets/logo.webp" width="74" alt="समाधान Setu"><span>Academic prototype · Simulated government roles · Shared private cloud storage · No paid AI · Not an official government service</span></div>'}
function landing(){nav.innerHTML='<span class="tag">Academic demonstration</span>';app.innerHTML='<div class="hero"><div><div class="eyebrow">From local problems to practical solutions</div><h1>Better communities start with a voice.</h1><p>Report community challenges, connect with solution partners and follow every step of the journey.</p><button data-login="citizen">Citizen login →</button></div><div class="heroart"><div>01 &nbsp; Citizen reports a problem</div><div>02 &nbsp; ML suggests a category</div><div>03 &nbsp; Admin verifies and assigns</div><div>04 &nbsp; Student proposes a solution</div><div>05 &nbsp; Admin and citizen review</div></div></div><div class="cards">'+[['citizen','01','Report & track','Submit local problems with photos and follow your own reports.'],['admin','02','Government administration','Review, verify, reject or assign community problems.'],['student','03','Student collaboration','View assigned challenges and submit proposed solutions.']].map(([r,n,t,d])=>'<article class="rolecard"><div class="num">PORTAL '+n+'</div><h2>'+t+'</h2><p class="muted">'+d+'</p><button class="secondary" data-login="'+r+'">'+roleNames[r]+' login →</button></article>').join('')+'</div><div class="notice">Demo instructions: use the provided role-specific accounts, log out before switching roles, and open separate browsers to see the shared workflow. Do not enter real personal information.</div>'+foot()}
function login(r){nav.innerHTML='<button class="secondary" data-home>Back to home</button>';app.innerHTML='<section class="panel login"><img class="login-logo" src="/assets/logo.webp" width="142" alt="समाधान Setu"><div class="num">SECURE DEMO ACCESS</div><h2>'+roleNames[r]+' login</h2><p class="muted">Sign in with the '+roleNames[r].toLowerCase()+' demo account.</p><form id="login"><label class="field">Email<input type="email" name="email" value="'+r+'@samadhan.demo" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><div class="error" id="err" role="alert"></div><button class="full" type="submit">Sign in →</button></form></section>'+foot();document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const f=new FormData(e.target);try{const j=await api({role:r,email:f.get('email'),password:f.get('password')});role=j.role;filter='All';await load()}catch(err){document.querySelector('#err').textContent=err.message;btn.disabled=false}}}
function stats(xs){return '<div class="stats">'+[['Total reports',xs.length],['Awaiting review',xs.filter(x=>x.status==='Submitted').length],['In progress',xs.filter(x=>['Verified','Assigned','Solution proposed','Solution approved'].includes(x.status)).length],['Closed',xs.filter(x=>x.status==='Closed').length]].map(([n,v])=>'<div class="stat"><span class="muted">'+n+'</span><strong>'+v+'</strong></div>').join('')+'</div>'}
function card(x){let a='';const b=(op,label,cl='')=>'<button class="'+cl+'" data-op="'+op+'" data-id="'+esc(x.id)+'">'+label+'</button>';if(role==='admin'){if(x.status==='Submitted')a='<label class="field">Category<select class="category">'+Object.keys(routing).concat('Other / review').map(c=>'<option '+(x.category===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label><label class="field">Review note / rejection reason<input class="note" placeholder="Optional note; required to reject"></label>'+b('verify','Verify report')+b('reject','Reject','danger');if(x.status==='Verified')a='<label class="field">Assign to team<select class="team">'+['Civil Engineering Team','Environmental Engineering Team','Electrical Engineering Team','Biomedical Engineering Team','Agricultural Engineering Team','General expertise Team'].map(t=>'<option '+(t===x.expertise+' Team'?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+b('assign','Assign to selected team');if(x.status==='Solution proposed')a=b('approve','Approve proposed solution')+b('revise','Request revision','secondary')}if(role==='admin'){a+=b('open-edit','Edit complaint','secondary');if(editing===x.id){const options=(arr,selected)=>arr.map(v=>'<option '+(v===selected?'selected':'')+'>'+esc(v)+'</option>').join('');a+='<div class="notice"><b>Edit complaint details</b><label class="field">Status<select class="edit-status">'+options([...stages,'Rejected'],x.status)+'</select></label><label class="field">Category<select class="edit-category">'+options(Object.keys(routing).concat('Other / review'),x.category)+'</select></label><label class="field">Priority<select class="edit-priority">'+options(['Needs review','Low','Medium','High'],x.priority)+'</select></label><label class="field">Assigned team<select class="edit-team">'+options(['Unassigned','Civil Engineering Team','Environmental Engineering Team','Electrical Engineering Team','Biomedical Engineering Team','Agricultural Engineering Team','General expertise Team'],x.team||'Unassigned')+'</select></label><label class="field">Admin note<input class="edit-note" maxlength="500" value="'+esc(x.note||'')+'"></label>'+b('edit','Save changes')+b('cancel-edit','Cancel','secondary')+'</div>'}}if(role==='student'&&x.status==='Assigned')a='<label class="field">Your solution<textarea class="proposal" maxlength="2000" placeholder="Describe the proposed approach, resources and expected impact"></textarea></label>'+b('solution','Submit proposal');if(role==='citizen'&&x.status==='Solution approved')a='<p class="muted">The solution has been approved by the admin. Confirm only if it addresses the issue in this simulated workflow.</p>'+b('confirm','Confirm & close');
return '<article class="issue"><div class="top"><div><div class="tiny">'+esc(x.id)+' · '+esc(x.category)+'</div><h3>'+esc(x.title)+'</h3></div><span class="tag status" data-status="'+esc(x.status)+'">'+esc(x.status)+'</span></div><p>'+esc(x.description)+'</p>'+(x.photo&&/^data:image\/jpeg;base64,/.test(x.photo)?'<img alt="Reported issue" src="'+esc(x.photo)+'">':'')+'<div class="meta">Location: '+esc(x.location)+' · <span class="tag '+(x.priority==='High'?'high':'')+'">'+esc(x.priority)+'</span></div><div class="meta">Suggested department: '+esc(x.department)+(x.team?' · Assigned team: '+esc(x.team):'')+'</div>'+(x.status==='Rejected'?'':'<div class="steps" aria-label="Status progress">'+stages.map((s,i)=>'<span title="'+s+'" class="'+(i<=stages.indexOf(x.status)?'done':'')+'"></span>').join('')+'</div>')+(x.note?'<div class="meta">Review note: '+esc(x.note)+'</div>':'')+(x.solution?'<div class="solution"><b>Proposed solution</b><br>'+esc(x.solution)+'</div>':'')+(a?'<div class="workflow">'+a+'</div>':'')+'</article>'}
function list(xs){return '<div class="issues">'+(xs.length?xs.map(card).join(''):'<div class="empty">No reports to show.</div>')+'</div>'}
function analysis(s){const a=analyze(s);return '<b>'+esc(a.category)+'</b> · '+esc(a.priority)+'<br>Suggested department: '+esc(a.department)+'<br>Recommended expertise: '+esc(a.expertise)}
function render(){if(!role){landing();return}nav.innerHTML='<span class="tag">'+roleNames[role]+'</span> <button class="secondary" id="sync">Refresh</button> <button class="secondary" id="logout">Log out</button>';document.querySelector('#sync').onclick=()=>{editing=null;refresh(true)};document.querySelector('#logout').onclick=async()=>{try{await api({action:'logout'});role=null;data=[];editing=null;landing()}catch(e){toast(e.message)}};const title={citizen:'Citizen dashboard',admin:'Government administration',student:'Student workspace'}[role];const sub={citizen:'Report a problem and track reports in the shared citizen demo account.',admin:'Review reports, assign student teams and approve proposed solutions.',student:'Work on assigned community challenges.'}[role];let out='<div class="top"><div><div class="num">SIGNED IN · '+roleNames[role].toUpperCase()+'</div><h1 style="font-size:40px">'+title+'</h1><p class="muted">'+sub+'</p></div></div>';const visible=role==='student'?data.filter(x=>['Assigned','Solution proposed','Solution approved','Closed'].includes(x.status)&&x.team):data;out+=stats(visible);if(role==='citizen'){out+='<div class="layout"><section class="panel"><h2>Report a problem</h2><form id="report"><label class="field">Problem title<input name="title" required maxlength="100" placeholder="e.g. Damaged road"></label><label class="field">Description<textarea name="description" required maxlength="1000" placeholder="Explain the issue (English or Roman Hindi)"></textarea></label><div id="analysis" class="notice">Local ML suggestion appears as you type.</div><label class="field">Location<input name="location" required maxlength="120" placeholder="Village / town, district"></label><label class="field">Photo (optional)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview" hidden alt="Photo preview"><button type="submit">Submit report →</button></form></section><section class="panel"><h2>My reports</h2><label class="field">Find report by ID<input id="search" placeholder="SS-1001"></label><div id="list">'+list(visible)+'</div></section></div>'}else{out+='<section class="panel"><div class="top"><h2>'+(role==='admin'?'Complaint management':'Assigned challenges')+'</h2><label class="field" style="margin:0">Filter by status<select id="filter">'+['All',...stages,'Rejected'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div><div class="notice">'+(role==='admin'?'Review → Verify or reject → Assign team → Review solution → Citizen confirmation.':'Open an assigned report, write your proposal, and submit it for admin review. The demo student account represents all teams.')+'</div>'+list(visible.filter(x=>filter==='All'||x.status===filter))+'</section>'}app.innerHTML=out+foot();if(role==='citizen'){photo='';const form=document.querySelector('#report');form.description.oninput=()=>document.querySelector('#analysis').innerHTML=analysis(form.title.value+' '+form.description.value);form.title.oninput=form.description.oninput;document.querySelector('#search').oninput=e=>document.querySelector('#list').innerHTML=list(visible.filter(x=>x.id.includes(e.target.value.trim().toUpperCase())));document.querySelector('#photo').onchange=e=>{photo='';const file=e.target.files[0],img=document.querySelector('#preview');img.hidden=true;if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10000000){e.target.value='';toast('Choose JPG, PNG or WebP under 10 MB.');return}const temp=new Image(),url=URL.createObjectURL(file);temp.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(temp.width,temp.height));c.width=Math.max(1,Math.round(temp.width*scale));c.height=Math.max(1,Math.round(temp.height*scale));c.getContext('2d').drawImage(temp,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.5);if(photo.length>200000){photo='';e.target.value='';toast('Image too large after compression; choose a smaller photo.');URL.revokeObjectURL(url);return}img.src=photo;img.hidden=false;URL.revokeObjectURL(url)};temp.onerror=()=>{URL.revokeObjectURL(url);toast('Unable to open image')};temp.src=url};form.onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(form),title=f.get('title').trim(),description=f.get('description').trim(),location=f.get('location').trim();if(!title||!description||!location){toast('Complete all required fields');return}busy=true;try{const j=await api({action:'mutate',operation:'report',payload:{title,description,location,photo}});data=j.data;render();toast('Submitted: '+j.id)}catch(e){toast(e.message)}finally{busy=false}}}else document.querySelector('#filter').onchange=e=>{filter=e.target.value;render()}}
